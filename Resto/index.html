<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resturant</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" i
        ntegrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <div class="main">
        <div class="nav-bar">
            <div class="nav1">
                <div class="logo">
                    <h2>Resto&Bar</h2>
                </div>
                <ul class="links">
                    <li>Home</li>
                    <li>Menu</li>
                    <li>About</li>
                    <li>Location</li>
                    <li>Contact</li>
                </ul>
            </div>
            <div class="icons">
                <i class="fa-solid fa-magnifying-glass"></i>
                <i class="fa-notdog fa-solid fa-bars"></i>
            </div>
        </div>
        <div class="hero">
            <div class="left">
                <span class="left1">Are you Hungry?</span>
                <span class="left2"> Don't Wait</span>
                <span class="left3">Let's start to order food now</span>
                <span class="left4">Check out Menu</span>
            </div>
            <div class="food" id="food"></div>
        </div>
        <div class="items">
            <div id="food1"></div>
            <div id="food2"></div>
            <div id="food3"></div>
            <div id="food4"></div>
        </div>
    </div>
</body>
<script src="index.js"></script>
</html>
